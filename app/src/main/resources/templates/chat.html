<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAZZZZZ Real Time Chat</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- SockJS & STOMP -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top, #1c1c1e, #000);
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease-in-out;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #chat {
      height: 300px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: #555 #1c1c1e;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb {
      background-color: #555;
      border-radius: 3px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      word-wrap: break-word;
      transition: 0.2s ease-in-out;
    }

    .message:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .sender {
      font-weight: 600;
      color: #00c6ff;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      color: #f5f5f5;
      border: none;
      border-radius: 10px;
      transition: all 0.3s;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 0.25rem rgba(0, 114, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      border: none;
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #00c6ff, #0072ff);
    }

    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <h1>💬 CRAZZZZ Chat</h1>

    <div id="chat"></div>

    <div class="input-group mb-3">
      <input type="text" id="senderInput" class="form-control" placeholder="Your Name..." />
    </div>
    <div class="input-group mb-3">
      <input type="text" id="msgInput" class="form-control" placeholder="Type your message..." />
      <button id="sendMessage" class="btn btn-primary">Send</button>
    </div>

    <div class="footer">Powered by Spring Boot ⚡ WebSocket</div>
  </div>

  <script>
    let stompClient = null;

    function setConnected(connected) {
      document.getElementById('sendMessage').disabled = !connected;
      document.getElementById('msgInput').disabled = !connected;
      document.body.style.background = connected
        ? "radial-gradient(circle at top, #1c1c1e, #000)"
        : "radial-gradient(circle at top, #550000, #000)";
    }

    function connect() {
      const socket = new SockJS('/chat');
      stompClient = new window.StompJs.Client({
        webSocketFactory: () => socket,
        reconnectDelay: 5000,
        onConnect: (frame) => {
          console.log('Connected: ' + frame);
          setConnected(true);
          stompClient.subscribe('/topic/messages', (message) => {
            showMessage(JSON.parse(message.body));
          });
        },
        onDisconnect: () => {
          setConnected(false);
        },
      });
      stompClient.activate();
    }

    function showMessage(message) {
      const chat = document.getElementById('chat');
      const messageElement = document.createElement('div');
      messageElement.className = "message";
      messageElement.innerHTML = `<span class="sender">${message.sender}:</span> ${message.content}`;
      chat.appendChild(messageElement);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const sender = document.getElementById('senderInput').value;
      const content = document.getElementById('msgInput').value;
      if (!sender || !content) return;

      const chatMsg = { sender, content };
      stompClient.publish({
        destination: "/app/sendMessage",
        body: JSON.stringify(chatMsg),
      });

      document.getElementById('msgInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
  </script>
</body>

</html>
