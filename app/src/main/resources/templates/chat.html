<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZZZZZZZZZZZZY Real Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
</head>

<body>
    <div class="container mt-4">
        <h1 class=" text-center">Real Time Chat Application</h1>

        <div id="chat" class="border rounded p-3 mb-3" style="height: 300px; overflow-y: auto;">

        </div>

        <div class="input-group mb-3">
            <input type="text" id="senderInput" class="form-control" placeholder="Your Name..." />
        </div>
        <div class="input-group mb-3">
            <input type="text" id="msgInput" class="form-control" placeholder="Enter Your Message..." />
            <div id="input-group-append">
                <button id="sendMessage" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>
</body>
<script>
    let stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
        document.getElementById('msgInput').disabled = !connected;
        // make background red if not connected
        document.body.style.backgroundColor = connected ? "#ffffff" : "#f8d7da";
    }

    function connect() {
        const socket = new SockJS('/chat');
        stompClient = new window.StompJs.Client({
            webSocketFactory: () => socket,
            reconnectDelay: 5000,
            onConnect: (frame) => {
                console.log('Connected: ' + frame);
                setConnected(true);
                stompClient.subscribe('/topic/messages', (message) => {
                    showMessage(JSON.parse(message.body));
                });
            },
            onDisconnect: () => {
                setConnected(false);
            },
        });
        stompClient.activate();
    }

    function showMessage(message) {
        const chat = document.getElementById('chat');
       // const messageElement = document.createElement('div');
        //messageElement.innerHTML = `<strong>${message.sender}:</strong> ${message.content}`;

        var messageElement = document.createElement('div');
        messageElement.textContent = message.sender+':'+message.content;
        messageElement.className = "border-bottom mb-1";
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const sender = document.getElementById('senderInput').value;
        const content = document.getElementById('msgInput').value;
        if (!sender || !content) return;

        const chatMsg = { sender, content };
        stompClient.publish({
            destination: "/app/sendMessage",
            body: JSON.stringify(chatMsg),
        });

        document.getElementById('msgInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>


</html>
